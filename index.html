<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | PVZ GW 2D</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      /* Optional: Match the NovOS aesthetic by ensuring the background is dark during merge */
      body { background: #0a0a0a; } 
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=1280 height=720></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">PVZ GW 2D</div>
      </div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Game 0.5.8 BROWSER.loader.js";
      
      // Configuration template
      var config = {
        dataUrl: "", // This will be filled by our merge function
        frameworkUrl: buildUrl + "/Game 0.5.8 BROWSER.framework.js.br",
        codeUrl: buildUrl + "/Game 0.5.8 BROWSER.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Denarser",
        productName: "PVZ GW 2D",
        productVersion: "0.5.8",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
        unityShowBanner('WebGL builds are not supported on mobile devices.');
      } else {
        canvas.style.width = "1280px";
        canvas.style.height = "720px";
      }

      loadingBar.style.display = "block";

      // --- SPLIT FILE MERGE LOGIC ---
      async function mergeAndLaunch() {
        const part1Url = buildUrl + "/Game 0.5.8 BROWSER.data.br.part1";
        const part2Url = buildUrl + "/Game 0.5.8 BROWSER.data.br.part2";

        try {
          // Fetch both parts simultaneously
          const [res1, res2] = await Promise.all([
            fetch(part1Url),
            fetch(part2Url)
          ]);

          if (!res1.ok || !res2.ok) throw new Error("Failed to download data parts.");

          const blob1 = await res1.blob();
          const blob2 = await res2.blob();

          // Merge into a single Blob
          const combinedBlob = new Blob([blob1, blob2], { type: "application/octet-stream" });
          
          // Create a local URL for the combined file
          config.dataUrl = URL.createObjectURL(combinedBlob);

          // Now load the Unity Loader script
          var script = document.createElement("script");
          script.src = loaderUrl;
          script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
              progressBarFull.style.width = 100 * progress + "%";
            }).then((unityInstance) => {
              loadingBar.style.display = "none";
              fullscreenButton.onclick = () => {
                unityInstance.SetFullscreen(1);
              };
            }).catch((message) => {
              alert(message);
            });
          };
          document.body.appendChild(script);

        } catch (err) {
          unityShowBanner("Critical error merging data files: " + err.message, "error");
        }
      }

      // Execute the merge process
      mergeAndLaunch();

    </script>
  </body>
</html>
